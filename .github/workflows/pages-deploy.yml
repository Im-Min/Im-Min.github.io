name: Deploy Hugo site to Pages

on:
  push:
    branches:
      - main  # 브랜치 이름 (master라면 master로 변경)
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive  # 중요: 테마(PaperMod)를 가져오기 위해 필수
          fetch-depth: 0

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v2
        with:
          hugo-version: 'latest'
          extended: true  # 중요: PaperMod 테마는 extended 버전 필수

      - name: Build site
        run: hugo --minify
        # Jekyll 명령어(bundle exec...) 대신 Hugo 명령어를 사용합니다.

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public 
          # 중요: Jekyll은 _site 폴더를 쓰지만, Hugo는 public 폴더를 씁니다.

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4